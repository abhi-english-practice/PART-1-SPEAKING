<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5ecde">
<title>Reading 8 · ABHI · UYEN</title>
<style>
:root {
  color-scheme: light;
  --bg:#f5ecde; --surface:#fffaf1; --lift:#fcf7ee; --line:#eddfc9;
  --paper:#111111; --muted:#635c53; --faint:#6c6358;
  --red:#b82313; --teal:#009f8e; --sand:#f7ecd9;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Open Sans",system-ui,sans-serif;
}
* { box-sizing:border-box }
[hidden] { display:none!important }
body { margin:0;background:var(--bg);color:var(--paper);font:15px/1.55 var(--sans) }
button,select,textarea,input { font:inherit }
button,select { color:var(--paper);background:var(--lift);border:1px solid var(--line);border-radius:8px }
button { cursor:pointer;padding:.6rem .95rem;font-weight:650 }
button:hover:not(:disabled),select:hover { border-color:#c6aa86;background:#f7ecd9 }
button:disabled { opacity:.42;cursor:default }
:focus-visible { outline:2px solid var(--red);outline-offset:4px }
button.primary { background:#007f73;border-color:#007f73;color:#fff }
button.primary:hover { background:#006b62 }
button.quiet { background:transparent;color:var(--muted) }
select { padding:.5rem .65rem }
.frame { width:min(1480px,calc(100% - 64px));margin-inline:auto }
.masthead { border-bottom:1px solid var(--line);background:#fffaf1 }
.mast-inner { display:flex;align-items:center;justify-content:space-between;min-height:78px }
.brand { text-decoration:none;color:var(--paper);font-size:1.4rem;font-weight:850;letter-spacing:.075em }
.brand span { color:var(--red) }
.mast-note,.eyebrow,.rail-label,.caption { color:#b82313;letter-spacing:.15em;text-transform:uppercase;font-size:.69rem;font-weight:750 }
.layout { display:grid;grid-template-columns:254px minmax(0,1fr);gap:24px;align-items:start;margin-block:26px }
.rail,.workspace { border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0 }
.rail { position:sticky;top:16px;padding:17px;max-height:calc(100dvh - 32px);overflow:auto;scrollbar-width:thin }
.rail-heading { display:flex;gap:12px;align-items:center;padding-bottom:17px;border-bottom:1px solid var(--line) }
.rail-heading strong { display:block;font:700 1.45rem/1.16 var(--serif) }
.rail-heading small,.topic-choice small { display:block;color:var(--muted);font-size:.75rem }
.rail-mark { width:46px;height:46px;flex:none;display:grid;place-content:center;grid-auto-flow:column;align-items:baseline;border-radius:9px;border:1px solid #eddfc9;background:#e3ffa9;color:#111;font:700 1.28rem var(--serif) }
.rail-mark span { color:var(--red);font-size:.87em }
.rail-label { margin:18px 4px 10px }
.topic-choice { text-align:left;display:flex;align-items:center;gap:10px;width:100%;margin-bottom:8px;padding:9px;line-height:1.35 }
.topic-choice[aria-current=true] { background:#e3ffa9;border-color:#d5ef9d }
.topic-choice strong { display:block;font-size:.88rem }
.topic-choice small { margin-top:3px }
.topic-number { width:32px;height:32px;display:grid;place-content:center;border-radius:50%;background:#f2e3cc;color:#111;flex:none;font-size:.76rem }
.topic-choice[aria-current=true] .topic-number { background:#b6e46b;color:#111 }
.section-links { border-left:1px solid #dbc7a9;margin:3px 0 12px 24px;padding:0 0 0 9px }
.section-links button { display:block;width:100%;text-align:left;padding:.28rem .42rem;font-size:.76rem;font-weight:500;background:none;border:0;color:var(--muted) }
.mobile-topics { display:none }
.workspace { overflow:hidden }
.tabbar { display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--line);background:#292927 }
#tabs { display:flex;gap:7px;flex-wrap:wrap }
#tabs button[aria-current=true] { background:#e9ffc7;border-color:#cee8a6;color:#111 }
.tabbar button { font-size:.83rem;white-space:nowrap }
.inside { padding:22px clamp(16px,3vw,36px) 30px }
.cover { display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:18px;min-height:228px }
.cover img { grid-column:2;grid-row:1;display:block;width:100%;height:auto;border-radius:12px }
.cover-copy { grid-column:1;grid-row:1;min-width:0;padding-block:15px }
.cover-copy h1 { margin:.35rem 0 .55rem;font:700 clamp(2.1rem,4vw,4.2rem)/1.02 var(--serif);letter-spacing:-.035em;text-wrap:balance }
.cover-copy p { margin:0 }
#topicMeta { color:var(--muted);font-size:.84rem }
.audio-strip { margin:17px 0 24px;padding:11px 13px;display:grid;grid-template-columns:auto minmax(70px,1fr) auto auto;gap:12px;align-items:center;background:#f7ecd9;border:1px solid var(--line);border-radius:10px }
.audio-actions { display:flex;gap:7px }
#play { min-width:106px }
#seek,.progress { width:100%;accent-color:#009f8e }
#clock { color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.82rem }
.toolbar,.actions,.review-controls,.mode-switch { display:flex;align-items:center;gap:8px;flex-wrap:wrap }
.toolbar { margin-bottom:12px }
.toolbar button,.actions button,.review-controls button { font-size:.83rem }
.toolbar .spacer,.actions .spacer { flex:1 }
.tone-wine { --ink:#ffe09b }
.tone-brown { --ink:#bcecc0 }
.tone-gray { --ink:#e6ddd2 }
.toolbar [data-tone] { background:var(--ink) }
.story { border-top:1px solid var(--line) }
.read-section { padding:23px 0;border-bottom:1px solid var(--line);scroll-margin-top:18px }
.section-head { display:flex;align-items:center;gap:12px;margin-bottom:8px }
.section-head .caption { border-right:1px solid #eddfc9;padding-right:12px;letter-spacing:.08em }
.section-head h2 { margin:0;font:700 clamp(1.2rem,2.6vw,1.65rem)/1.25 var(--serif) }
.story-text,.vi-text,.example { text-align:justify;text-justify:inter-word }
.story-text { margin:.65rem 0 0;font:400 clamp(1.12rem,1.8vw,1.44rem)/1.68 var(--serif) }
.story-text .cue { color:var(--paper);font-weight:750;background:var(--cue-bg,#ffe09b);border-radius:4px;padding:.04em .12em;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone }
.story-text .cue-green { --cue-bg:#bcecc0 }
.story-text .cue:hover { text-decoration:underline;text-underline-offset:.16em }
.sentence.is-playing { background:#c4f0e9;box-shadow:0 .12em #c4f0e9;box-decoration-break:clone;-webkit-box-decoration-break:clone }
.manual { background:var(--ink);color:#111;border-radius:.12em }
.cue .manual { text-decoration:underline;text-underline-offset:3px }
.vi-text { padding:11px 15px;margin:.85rem 0 0;background:#f7ecd9;border-left:2px solid #009f8e;border-radius:0 6px 6px 0;color:#55483a }
.activity,.card-panel { border:1px solid var(--line);background:var(--lift);border-radius:11px;padding:clamp(13px,2.5vw,24px) }
.mode-switch { margin-bottom:12px }
.mode-switch button[aria-pressed=true] { background:#e9ffc7;border-color:#badb84 }
.activity-head { display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px }
.activity-head h2 { font:700 1.3rem var(--serif);margin:.2rem 0 }
.progress { display:block;height:7px;margin:10px 0 18px }
.chunk-area { min-height:57px;border:1px dashed #b6a289;border-radius:8px;padding:9px;margin-bottom:10px;display:flex;align-items:center;flex-wrap:wrap;gap:7px }
.chunk-bank { display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px }
.chunk-area button { background:#e9ffc7 }
textarea { color:var(--paper);background:#fffaf1;border:1px solid #b6a289;border-radius:8px;padding:12px;resize:vertical;width:100%;min-height:105px;margin:10px 0 }
.feedback { margin:.7rem 0 0;color:#8d281a }
.answer { margin:.7rem 0 0;padding:.6rem .8rem;background:#f7ecd9;border-radius:7px }
.review-controls { margin-bottom:13px }
.card-panel h2,dialog h2 { font:700 clamp(1.65rem,3.6vw,2.8rem)/1.08 var(--serif);letter-spacing:-.02em;margin:.65rem 0 .5rem;color:#111 }
.card-panel .actions { margin-top:12px }
.card-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 }
.meaning { padding:11px 13px;background:#fffaf1;border:1px solid #eddfc9;border-radius:8px }
.meaning[lang=vi] { background:var(--sand);border-color:#eddfc9;color:#55483a }
.meaning p { margin:.2rem 0 0 }
.example { border-top:1px solid var(--line);padding-top:13px;margin:15px 0 0 }
.example p { margin:.35rem 0 0 }
.example [lang=vi] { color:#55483a }
.ipa { color:var(--muted);font-size:.91rem }
dialog { width:min(610px,calc(100% - 26px));max-height:calc(100dvh - 26px);padding:0;border:1px solid #dbc7a9;border-radius:14px;background:#fffaf1;color:var(--paper);box-shadow:0 25px 90px #0005 }
dialog::backdrop { background:#0b090bcc }
.dialog-body { padding:clamp(16px,4vw,28px) }
.dialog-top { display:flex;justify-content:space-between;gap:10px;align-items:flex-start }
.dialog-footer { display:grid;grid-template-columns:1fr 1fr }
.dialog-footer button { border-radius:0;padding:.85rem;border:0;border-top:1px solid #eddfc9 }
.dialog-footer button:first-child { background:#bcecc0 }
.dialog-footer button:last-child { background:#f7ecd9 }
.dialog-footer button:hover { filter:brightness(1.28) }
.footer { display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:14px 0 23px;color:var(--muted);font-size:.76rem }
@media(max-width:850px) {
 .frame { width:calc(100% - 28px) }
 .layout { grid-template-columns:1fr;gap:10px;margin-block:12px }
 .rail { position:static;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 13px;overflow:visible }
 .rail-heading { border:0;padding:0 }
 .rail-heading strong { font-size:1.17rem }
 .rail-mark { width:38px;height:38px }
 #topics,.rail-label { display:none }
 .mobile-topics { display:flex;align-items:center;gap:8px;font-size:.82rem }
 .mobile-topics select { min-width:150px;max-width:100% }
 .mast-inner { min-height:57px }
 .cover { min-height:176px }
}
@media(max-width:500px) {
 .frame { width:calc(100% - 18px) }
 .mast-note { display:none }
 .rail { align-items:stretch;flex-direction:column;gap:7px }
 .mobile-topics select { flex:1 }
 .inside { padding:10px 10px 19px }
 .tabbar { align-items:flex-start;padding:8px;gap:6px }
 .tabbar button { padding:.42rem .49rem;font-size:.74rem }
 #tabs { gap:4px }
 .cover { grid-template-columns:1fr;gap:8px;min-height:0 }
 .cover-copy { padding:8px 0 0 }
 .cover-copy h1 { font-size:clamp(1.55rem,7.4vw,2.3rem) }
 .cover img { grid-column:1;grid-row:2 }
 .audio-strip { grid-template-columns:1fr auto auto;gap:7px;padding:8px;margin:10px 0 15px }
 #seek { grid-column:1/-1;grid-row:2;margin:0 }
 .audio-actions button { padding:.45rem .62rem }
 #play { min-width:76px }
 .card-grid { grid-template-columns:1fr }
 .story-text { line-height:1.58 }
}
.source-prompt { color:#635c53;margin:.65rem 0 .15rem;font:italic 1.08rem/1.35 var(--serif) }
.cues-muted .story-text .cue { color:inherit;background:none;font-weight:inherit;padding:0 }
.cues-muted .story-text .cue:hover { text-decoration:underline;text-decoration-color:var(--red) }
@media(max-width:500px) {
 .story-text,.vi-text,.example { text-align:start }
}
#seek { appearance:none;background:transparent;height:18px;margin-inline:0 }
#seek::-webkit-slider-runnable-track { height:5px;background:#3b3b3b;border-radius:8px }
#seek::-moz-range-track { height:5px;background:#3b3b3b;border-radius:8px }
#seek::-webkit-slider-thumb { appearance:none;width:15px;height:15px;margin-top:-5px;background:#009f8e;border:1px solid #008578;border-radius:50% }
#seek::-moz-range-thumb { width:13px;height:13px;background:#009f8e;border:1px solid #008578;border-radius:50% }


.tabbar button { background:#292927;color:#fffaf1;border-color:#797974 }
.tabbar button:hover:not(:disabled) { background:#41413d;border-color:#b1b1a8 }
.tabbar button.quiet { color:#fffaf1 }
.tabbar button:focus-visible { outline-color:#e9ffc7 }
.audio-strip { border-radius:16px }
.audio-actions button { border-radius:999px }
#play { background:var(--teal);border-color:var(--teal);color:#111 }
#play:hover { background:#008e80;border-color:#008e80 }
#stop { background:#fff;color:var(--muted) }
</style>
</head>

</main>

async function playAudio(range=null,fromDialog=false,resumeClip=false) {

function markedText(text,from,marks) {
  const edges=new Set([0,text.length]);
  for(const m of marks) {
    if(m.end<=from || m.start>=from+text.length) continue;
    edges.add(Math.max(0,m.start-from));
    edges.add(Math.min(text.length,m.end-from));
  }
  const cuts=[...edges].sort((a,b)=>a-b);
  return cuts.slice(0,-1).map((x,i)=>{
    const fragment=escapeHtml(text.slice(x,cuts[i+1]));
    const m=marks.findLast(item=>x+from>=item.start && x+from<item.end);
    return m?'<span class="manual tone-'+m.tone+'">'+fragment+'</span>':fragment;
  }).join('');
}
function phraseMarkup(line,offset,section,s,i) {
  const marks=progress().marked[s];
  const cues=[];
  section.cards.forEach(([phrase,,,,sentence],c)=>{
    if(sentence!==i) return;
    const x=line.toLowerCase().replaceAll('’',"'").indexOf(phrase.toLowerCase().replaceAll('’',"'"));
    if(x>=0)cues.push({x,end:x+phrase.length,c});
  });
  let start=0, html='';
  for(const cue of cues.sort((a,b)=>a.x-b.x)) {
    if(cue.x<start)continue;
    html+=markedText(line.slice(start,cue.x),offset+start,marks);
    html+='<span class="cue'+(cue.c%2?' cue-green':'')+'" tabindex="0" role="button" data-word="'+s+':'+cue.c+'">'+markedText(line.slice(cue.x,cue.end),offset+cue.x,marks)+'</span>';
    start=cue.end;
  }
  return html+markedText(line.slice(start),offset+start,marks);
}

function readSelection() {
  const selection=window.getSelection();
  if(!selection?.rangeCount||selection.isCollapsed)return null;
  const range=selection.getRangeAt(0);
  const selected=[];
  for(const el of document.querySelectorAll('[data-story]')) {
    if(!range.intersectsNode(el))continue;
    const toOffset=(container,offset,otherwise)=>{
      if(!el.contains(container))return otherwise;
      const prefix=document.createRange();
      prefix.selectNodeContents(el);
      prefix.setEnd(container,offset);
      return prefix.toString().length;
    };
    const start=toOffset(range.startContainer,range.startOffset,0);
    const end=toOffset(range.endContainer,range.endOffset,el.textContent.length);
    if(end>start)selected.push({s:Number(el.dataset.story),start,end});
  }
  return selected.length?selected:null;
}
function saveMarks(){progress().undo.push(progress().marked.map(list=>[...list]));}
function mark(tone) {
  const selected=readSelection()||state.selection;
  if(!selected)return;
  saveMarks();
  for(const {s,start,end} of selected) {
    if(tone)progress().marked[s].push({start,end,tone});
    else progress().marked[s]=progress().marked[s].flatMap(m=>{
      if(m.end<=start||m.start>=end)return [m];
      const pieces=[];
      if(m.start<start)pieces.push({...m,end:start});
      if(m.end>end)pieces.push({...m,start:end});
      return pieces;
    });
  }
  window.getSelection()?.removeAllRanges();
  state.selection=null;
  renderHome();paintAudio();
}

  const build=state.exercise==='build';
  const done=progress().done[state.exercise];
  resetExerciseChoice();
  const opts=steps.map((step,i)=>'<option value="'+i+'"'+(i===state.step?' selected':'')+'>Sentence '+(step.index+1)+(step.count>1?' · Part '+(step.part+1):'')+'</option>').join('');
  $('view').innerHTML='<div class="mode-switch"><button data-ex="build" aria-pressed="'+build+'">Build with chunks</button><button data-ex="type" aria-pressed="'+!build+'">Listen &amp; type</button></div>'+
    '<section class="activity"><div class="activity-head"><div><span class="caption">'+escapeHtml(section.title)+'</span><h2>Sentence '+(item.index+1)+' / '+sentences().length+
    (item.count>1?' · Part '+(item.part+1)+' / '+item.count:'')+'</h2></div><select id="stepPick" aria-label="Choose sentence">'+opts+'</select></div>'+
    '<progress class="progress" id="exerciseProgress" max="'+steps.length+'" value="'+done.size+'" aria-label="Completed exercises"></progress>'+
    (build ? '<div class="chunk-area" id="chosen" aria-label="Your sentence"></div><div class="chunk-bank" id="bank" aria-label="Available chunks"></div>' :
      '<div class="actions"><button id="listenPart"'+(item.range?'':' disabled')+'>▸ Listen '+(item.count>1?'to part':'to sentence')+'</button></div><textarea id="typed" aria-label="Type what you hear" placeholder="Type what you hear…" spellcheck="false" autocomplete="off"></textarea>')+
    '<div class="actions"><button id="backStep"'+(state.step===0?' disabled':'')+'>Back</button><button class="primary" id="checkStep">Check</button><button id="nextStep"'+(state.step===steps.length-1?' disabled':'')+'>Next</button></div>'+
    '<div class="actions" style="margin-top:8px"><button id="stepHint" aria-expanded="false">Hint</button><button id="stepClear">Clear</button><button id="stepAnswer" aria-expanded="false">Show Answer</button><button id="stepVi" aria-expanded="false">Show Vietnamese</button></div>'+
    '<p id="checkMessage" class="feedback" role="status" hidden></p><p id="hintPanel" class="answer" hidden></p><p id="answerPanel" class="answer" hidden>'+escapeHtml(item.text)+'</p>'+
    '<div class="vi-text" id="exerciseVi" lang="vi" hidden><strong>'+escapeHtml(section.viTitle)+'</strong><br>'+(section.viPrompt?escapeHtml(section.viPrompt)+'<br>':'')+escapeHtml(section.vi)+'</div></section>';
  document.querySelectorAll('[data-ex]').forEach(button=>button.onclick=()=>{
    if(button.dataset.ex!==state.exercise){state.exercise=button.dataset.ex;changeStep(0);}
  });
  function paintChunks() {
    const chip=(i,selected)=>'<button data-chunk="'+i+'" title="'+(selected?'Return chunk':'Add chunk')+'">'+escapeHtml(item.chunks[i])+'</button>';
    $('chosen').innerHTML=state.chosen.map(i=>chip(i,true)).join('');
    $('bank').innerHTML=state.bank.filter(i=>!state.chosen.includes(i)).map(i=>chip(i,false)).join('');
  }
  if(build) {
    paintChunks();
    $('chosen').onclick=event=>{
      const button=event.target.closest('[data-chunk]');
      if(button){state.chosen=state.chosen.filter(i=>i!==Number(button.dataset.chunk));paintChunks();}
    };
    $('bank').onclick=event=>{
      const button=event.target.closest('[data-chunk]');
      if(button){state.chosen.push(Number(button.dataset.chunk));paintChunks();}
    };
  } else $('listenPart').onclick=()=>{if(item.range)playAudio(item.range);};
  $('stepPick').onchange=event=>changeStep(Number(event.target.value));
  $('backStep').onclick=()=>changeStep(state.step-1);
  $('nextStep').onclick=()=>changeStep(state.step+1);
  $('stepHint').onclick=()=>{
    $('hintPanel').textContent=build?'Start with “'+item.chunks[0]+'”':'The first word is “'+item.text.split(/\s/)[0]+'”.';
    togglePanel('stepHint','hintPanel','Hint','Hide Hint');
  };
  $('stepAnswer').onclick=()=>togglePanel('stepAnswer','answerPanel','Show Answer','Hide Answer');
  $('stepVi').onclick=()=>togglePanel('stepVi','exerciseVi','Show Vietnamese','Hide Vietnamese');
  $('stepClear').onclick=()=>changeStep(state.step);
  $('checkStep').onclick=()=>{
    const answer=build?state.chosen.map(i=>item.chunks[i]).join(' '):$('typed').value;
    const correct=build?answer===item.text:[item.text,item.variant].filter(Boolean).some(expected=>normal(answer)===normal(expected));
    const msg=$('checkMessage');
    msg.textContent=correct?'Correct.':(answer.trim()?'Try again. Your answer differs from the source.':'Enter an answer first.');
    msg.hidden=false;
    if(correct){done.add(state.step);$('exerciseProgress').value=done.size;}
  };
}
function togglePanel(button,panel,on,off) {
  $(panel).hidden=!$(panel).hidden;
  $(button).textContent=$(panel).hidden?on:off;
  $(button).setAttribute('aria-expanded',String(!$(panel).hidden));
}

function detailsMarkup(entry,prefix) {
  const [,ipa,definition,vi,i,exampleVi]=entry.card;
  const line=current().sections[entry.s].lines[i].join(' ');
  return '<p class="ipa">'+escapeHtml(ipa)+'</p><div class="card-grid"><div class="meaning"><span class="caption">Simple English</span><p>'+escapeHtml(definition)+'</p></div>'+
    '<div class="meaning" lang="vi" data-vi="'+prefix+'" hidden><span class="caption">Vietnamese</span><p>'+escapeHtml(vi)+'</p></div></div>'+
    '<div class="example"><span class="caption">Example from the source</span><p>'+escapeHtml(line)+'</p><p lang="vi" data-vi="'+prefix+'" hidden>'+escapeHtml(exampleVi)+'</p></div>';
}
function toggleVietnamese(button,prefix) {
  const show=button.getAttribute('aria-pressed')!=='true';
  button.setAttribute('aria-pressed',String(show));
  button.textContent=show?'Hide Vietnamese':'Show Vietnamese';
  document.querySelectorAll('[data-vi="'+prefix+'"]').forEach(el=>el.hidden=!show);
}
function openWord(key) {
  const entry=cards().find(card=>card.key===key);
  if(!entry)return;
  stopAudio();
  const range=rangeOf(entry.s,entry.card[4]);
  $('dialogContent').innerHTML='<div class="dialog-body"><div class="dialog-top"><div class="actions">'+
    (range?'<button id="dialogListen">▸ Listen to sentence</button>':'')+'<button id="dialogVi" aria-pressed="false">Show Vietnamese</button></div>'+
    '<button id="closeDialog" aria-label="Close vocabulary box">×</button></div><h2 id="wordTitle">'+escapeHtml(entry.card[0])+'</h2>'+detailsMarkup(entry,'dialog')+
    '</div><div class="dialog-footer"><button id="knowWord">I know this</button><button id="studyWord">Study</button></div>';
  $('closeDialog').onclick=()=>dialog.close();
  $('dialogVi').onclick=()=>toggleVietnamese($('dialogVi'),'dialog');
  if(range)$('dialogListen').onclick=()=>{
    if(!dialogOwnsAudio) playAudio(range,true);
    else if(audio.paused) playAudio(null,true,true);
    else audio.pause();
  };
  $('knowWord').onclick=()=>{progress().known.set(key,'known');dialog.close();};
  $('studyWord').onclick=()=>{progress().known.set(key,'study');dialog.close();};
  dialog.showModal();
}
dialog.addEventListener('close',()=>{if(dialogOwnsAudio)stopAudio();});
dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();});

function renderReview() {
  const all=cards();
  const byKey=new Map(all.map(entry=>[entry.key,entry]));
  const order=state.cardOrder||all.map(entry=>entry.key);
  const known=progress().known;
  const list=order.map(key=>byKey.get(key)).filter(entry=>state.filter==='all'||
    (state.filter==='study' ? known.get(entry.key)==='study' : known.get(entry.key)==='known'));
  state.card=Math.max(0,Math.min(state.card,list.length-1));
  const entry=list[state.card];
  $('view').innerHTML='<div class="review-controls"><label>Cards <select id="reviewFilter" aria-label="Filter review cards"><option value="all">All</option><option value="study">Study</option><option value="known">Remembered</option></select></label>'+
    '<button id="shuffleCards">Shuffle</button><button id="resetCards">Reset Cards</button></div>'+
    (entry?'<article class="card-panel"><span class="caption">Card '+(state.card+1)+' / '+list.length+' · '+escapeHtml(current().sections[entry.s].title)+'</span>'+
      '<h2>'+escapeHtml(entry.card[0])+'</h2>'+
      '<div class="actions"><button id="flipCard" aria-expanded="'+state.revealed+'">'+(state.revealed?'Hide meaning':'Show meaning')+'</button>'+
      (rangeOf(entry.s,entry.card[4])?'<button id="listenCard">▸ Listen to sentence</button>':'')+
      (state.revealed?'<button id="cardVi" aria-pressed="false">Show Vietnamese</button>':'')+'</div>'+
      (state.revealed?detailsMarkup(entry,'review'):'')+
      '<div class="actions"><button id="prevCard"'+(state.card===0?' disabled':'')+'>Previous</button><button id="nextCard"'+(state.card===list.length-1?' disabled':'')+'>Next</button><span class="spacer"></span>'+
      '<button id="markStudy" aria-pressed="'+(known.get(entry.key)==='study')+'">Study</button><button class="primary" id="markKnown" aria-pressed="'+(known.get(entry.key)==='known')+'">I know this</button></div></article>':
      '<p class="card-panel">There are no cards in this group yet.</p>');
  function move(index) {
    stopAudio();
    state.card=index;
    state.revealed=false;
    renderReview();
  }
  $('reviewFilter').value=state.filter;
  $('reviewFilter').onchange=event=>{state.filter=event.target.value;move(0);};
  $('shuffleCards').onclick=()=>{state.cardOrder=shuffle(order);move(0);};
  $('resetCards').onclick=()=>{known.clear();state.filter='all';state.cardOrder=null;move(0);};
  if(!entry)return;
  $('flipCard').onclick=()=>{stopAudio();state.revealed=!state.revealed;renderReview();$('flipCard').focus();};
  if($('cardVi'))$('cardVi').onclick=()=>toggleVietnamese($('cardVi'),'review');
  if($('listenCard'))$('listenCard').onclick=()=>playAudio(rangeOf(entry.s,entry.card[4]));
  $('prevCard').onclick=()=>move(state.card-1);
  $('nextCard').onclick=()=>move(state.card+1);
  $('markStudy').onclick=()=>{known.set(entry.key,'study');move(state.card+(state.filter==='all'?1:0));};
  $('markKnown').onclick=()=>{known.set(entry.key,'known');move(state.card+(state.filter==='all'?1:0));};
}
setTopic(0);

</script>
